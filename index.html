<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C6A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hidden Heart">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hidden in My Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one calm column (max 640px), phrase-per-line verse cards, bottom tab bar; practice runs as a full-screen lesson. */
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --surface-2:#E2EAE4; --ink:#16231C; --muted:#526158; --line:#CCD8CF;
  --accent:#1C6A52; --accent-ink:#FFFFFF; --accent-soft:#D3E9DF; --gold:#A8701A; --gold-soft:#F5E6C8;
  --good:#2C7A39; --good-soft:#DCEFDA; --bad:#A9412D; --bad-soft:#F6DED7;
  --ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --scripture:"Literata", Georgia, "Times New Roman", serif;
  --fs:18px; --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --surface-2:#222D26; --ink:#E7EFE9; --muted:#9BAAA1; --line:#2F3C34;
  --accent:#5DC3A1; --accent-ink:#06130D; --accent-soft:#1B392E; --gold:#E3AE4E; --gold-soft:#3A2E17;
  --good:#71C77E; --good-soft:#1B3322; --bad:#EE8B74; --bad-soft:#3E231D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --surface-2:#222D26; --ink:#E7EFE9; --muted:#9BAAA1; --line:#2F3C34;
  --accent:#5DC3A1; --accent-ink:#06130D; --accent-soft:#1B392E; --gold:#E3AE4E; --gold-soft:#3A2E17;
  --good:#71C77E; --good-soft:#1B3322; --bad:#EE8B74; --bad-soft:#3E231D; color-scheme:dark }
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.shell{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{font-family:var(--scripture);font-style:italic;font-size:1.25rem;font-weight:400;letter-spacing:.01em}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.streak{color:var(--gold)}
.eyebrow{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hello{display:flex;flex-direction:column;gap:4px}
.hello h1{font-size:1.6rem}
.fit{white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.vc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.03em}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.muted{background:var(--surface-2);color:var(--muted)}
.tag{color:var(--muted);font-size:.9rem}
.ref{font-family:var(--scripture);font-weight:600;font-size:1.5rem}
.verse{font-family:var(--scripture);font-size:1.22rem;line-height:1.7;display:flex;flex-direction:column}
.verse .line{display:block}
.verse .w{border-radius:4px;transition:background .15s,color .15s;padding:0 1px}
.verse .w.lit{background:var(--gold-soft);color:var(--ink);box-shadow:0 0 0 2px var(--gold-soft)}
.veil{position:relative}
.veil.on .verse{filter:blur(7px);user-select:none}
.veil .unveil{display:none}
.veil.on .unveil{display:inline-flex;position:absolute;inset:0;margin:auto;width:max-content;height:max-content}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:disabled{opacity:.45;cursor:default;filter:none}
.btn.big{width:100%;min-height:62px;font-size:1.15rem}
.btn.small{min-height:42px;padding:6px 14px;font-size:.92rem}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
[hidden]{display:none!important}
body.has-dict .needs-nodict{display:none!important}
body:not(.has-music) .needs-music, body:not(.has-tts) .needs-tts, body:not(.has-dict) .needs-dict{display:none!important}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.day i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--muted)}
.day.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today i{border-color:var(--gold);color:var(--gold)}
.day.today.done i{color:var(--accent-ink);box-shadow:0 0 0 3px var(--gold-soft)}
.day i svg{width:18px;height:18px}
.meta{color:var(--muted);font-size:.92rem;text-align:center}
.start{display:flex;flex-direction:column;gap:8px}
.done-box{display:flex;gap:14px;align-items:center;background:var(--good-soft);border-radius:var(--r);padding:16px}
.done-box svg{width:34px;height:34px;color:var(--good);flex:none}
.done-box b{display:block}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h h3{font-size:1.1rem}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.item .t{font-family:var(--scripture);font-weight:600;font-size:1.08rem}
.item .s{color:var(--muted);font-size:.9rem;grid-column:1/-1;font-family:var(--scripture);font-style:italic;min-width:0}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.strength{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.bars{display:flex;gap:3px}
.bars b{width:10px;height:14px;border-radius:3px;background:var(--surface-2)}
.bars b.f{background:var(--accent)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px}
.howto{color:var(--muted);font-size:.92rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.82rem;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.set{display:flex;flex-direction:column;gap:10px}
.set label.h{font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:46px;padding:6px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{color:var(--muted);font-size:.9rem}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bad-soft);padding:10px 12px;border-radius:10px}

/* Lesson */
#session{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.s-top{max-width:720px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.s-top .x{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.s-top .x svg{width:26px;height:26px}
.bar{flex:1;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s}
.s-count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.leave{max-width:720px;width:calc(100% - 32px);margin:0 auto 8px}
.s-body{flex:1;overflow-y:auto}
.s-inner{max-width:720px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ex-h{display:flex;flex-direction:column;gap:6px}
.ex-h h2{font-size:1.45rem}
.ex-h .sub{color:var(--muted)}
.ex-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex-tags .r{font-family:var(--scripture);font-weight:600}
.s-foot{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.s-foot.ok{background:var(--good-soft);border-color:transparent}
.s-foot.bad{background:var(--bad-soft);border-color:transparent}
.s-foot .in{max-width:720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.fb{display:flex;flex-direction:column;gap:6px}
.fb h3{font-size:1.2rem;display:flex;gap:8px;align-items:center}
.fb h3 svg{width:26px;height:26px}
.s-foot.ok .fb h3{color:var(--good)}
.s-foot.bad .fb h3{color:var(--bad)}
.fb .ans{font-family:var(--scripture);font-size:1.02rem;line-height:1.6;max-height:30vh;overflow-y:auto}
.fb .ans mark{background:transparent;color:inherit;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.fb .ans .miss{color:var(--bad);font-weight:600;text-decoration:underline wavy}
.s-foot.ok .btn.primary{background:var(--good);border-color:var(--good)}
.s-foot.bad .btn.primary{background:var(--bad);border-color:var(--bad);color:#fff}

.slot{display:inline-block;min-width:4.2em;min-height:1.6em;vertical-align:baseline;padding:0 8px;margin:2px 1px;border:0;border-bottom:3px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 2px 2px;font-family:var(--scripture);font-size:inherit;line-height:1.4;color:var(--ink)}
.slot.next{box-shadow:0 0 0 2px var(--gold)}
.slot.right{border-color:var(--good);background:var(--good-soft)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tile{min-height:50px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);font-family:var(--scripture);font-size:1.08rem;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile.used{visibility:hidden}
.answer{min-height:80px;border:2px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.answer .tile{width:100%;background:var(--accent-soft);border-color:var(--accent)}
.answer.right .tile{background:var(--good-soft);border-color:var(--good)}
.answer.wrong .tile{background:var(--bad-soft);border-color:var(--bad)}
.answer .ph{color:var(--muted);padding:8px;font-size:.92rem}
.pool{display:flex;flex-direction:column;gap:8px}
.pool .tile{width:100%}
.ctx{color:var(--muted);font-family:var(--scripture);font-style:italic}
.blank-in{font-family:var(--scripture);font-size:inherit;border:0;border-bottom:3px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 2px 2px;padding:0 6px;margin:2px 1px;color:var(--ink);min-width:3.5em}
.blank-in.right{border-color:var(--good);background:var(--good-soft)}
.blank-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.hid{display:inline-block;color:transparent;border-bottom:2px solid var(--muted);line-height:1.1;user-select:none}
.got{color:var(--accent);font-weight:600}
.missed{color:var(--bad);font-weight:600}
.cursor{border-bottom-color:var(--gold);border-bottom-width:3px;background:var(--gold-soft);border-radius:4px 4px 0 0}
.fl-in{width:100%;min-height:58px;font-size:1.3rem;text-align:center;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);font-family:var(--ui)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
textarea.recite{width:100%;min-height:150px;font-family:var(--scripture);font-size:1.12rem;line-height:1.6;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
textarea.recite:focus{border-color:var(--accent);outline:none}
.mic.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.partial{color:var(--muted);font-style:italic;min-height:1.4em}
.hints{font-family:var(--scripture);color:var(--muted);letter-spacing:.12em;line-height:1.8;background:var(--surface-2);padding:10px 14px;border-radius:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left;font-family:var(--scripture);font-size:1.08rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quote{font-family:var(--scripture);font-size:1.25rem;line-height:1.6;padding:16px 18px;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.finish{align-items:center;text-align:center;padding-top:24px}
.finish .seal{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.finish .seal svg{width:52px;height:52px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;max-width:calc(100% - 32px);font-size:.95rem}
#sing{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.g-title{flex:1;display:flex;flex-direction:column;min-width:0}
.g-title .r{font-family:var(--scripture);font-weight:600;font-size:1.2rem}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rounds button{min-height:40px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:700;color:var(--muted)}
.rounds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lyrics{font-family:var(--scripture);font-size:1.5rem;line-height:1.9;display:flex;flex-direction:column;gap:2px;padding-block:8px}
.lline{opacity:.4;transition:opacity .2s}
.lline.cur,.lyrics.idle .lline{opacity:1}
.sy{border-radius:4px;padding:0 1px;transition:background .1s}
.sy.lit{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.hy{color:var(--muted);font-size:.8em}
.gw.rev{color:var(--accent)}
.fl{font-weight:600}
.g-ctrl{justify-content:space-between;align-items:center}
.g-ctrl .btn.primary{flex:1;min-width:150px}
.g-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){.lline,.sy{transition:none}}
#welcome h3{font-size:1.15rem}
.name-in{flex:1;min-width:0;min-height:48px;font:inherit;font-size:1.05rem;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.name-in:focus{border-color:var(--accent);outline:none}
.nudge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.nudge svg{width:16px;height:16px;flex:none}
.nudge>span{flex:1 1 12em;min-width:0}
.linkish{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
@media (max-width:420px){ .lyrics{font-size:1.3rem} .day i{width:30px;height:30px} .ref{font-size:1.35rem} .verse{font-size:1.12rem} }

/* Color themes (Settings → Color theme). Evergreen is the default set at the top. */
:root[data-palette="sunset"]{--bg:#FBF4EA;--surface:#FFFFFF;--surface-2:#F3E6D3;--ink:#2A1D12;--muted:#6E5A47;--line:#E7D5BE;--accent:#B85C0C;--accent-ink:#FFFFFF;--accent-soft:#FBE3C7;--gold:#C2410C;--gold-soft:#FDE1D3}
@media (prefers-color-scheme: dark){:root[data-palette="sunset"]:not([data-theme="light"]){--bg:#17110C;--surface:#221912;--surface-2:#2E2219;--ink:#F5EBDD;--muted:#B9A58E;--line:#3E3025;--accent:#F5A524;--accent-ink:#1E1206;--accent-soft:#45300F;--gold:#FB8A5C;--gold-soft:#4A2516;color-scheme:dark}}
:root[data-palette="sunset"][data-theme="dark"]{--bg:#17110C;--surface:#221912;--surface-2:#2E2219;--ink:#F5EBDD;--muted:#B9A58E;--line:#3E3025;--accent:#F5A524;--accent-ink:#1E1206;--accent-soft:#45300F;--gold:#FB8A5C;--gold-soft:#4A2516;color-scheme:dark}
:root[data-palette="ocean"]{--bg:#EEF3F8;--surface:#FFFFFF;--surface-2:#E0E9F2;--ink:#14202E;--muted:#4F6072;--line:#CBD7E4;--accent:#1F5F99;--accent-ink:#FFFFFF;--accent-soft:#D5E5F5;--gold:#A8701A;--gold-soft:#F5E6C8}
@media (prefers-color-scheme: dark){:root[data-palette="ocean"]:not([data-theme="light"]){--bg:#0E141B;--surface:#172029;--surface-2:#212C37;--ink:#E6EDF4;--muted:#9AAABA;--line:#2D3A47;--accent:#6FB1EA;--accent-ink:#05121F;--accent-soft:#1A3550;--gold:#E3AE4E;--gold-soft:#3A2E17;color-scheme:dark}}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#0E141B;--surface:#172029;--surface-2:#212C37;--ink:#E6EDF4;--muted:#9AAABA;--line:#2D3A47;--accent:#6FB1EA;--accent-ink:#05121F;--accent-soft:#1A3550;--gold:#E3AE4E;--gold-soft:#3A2E17;color-scheme:dark}

const $=(s,r=document)=>r.querySelector(s);

/* ---------- Melody engine (Web Audio) ---------- */
let AC=null,PLAY=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
const BLENDS=['bl','cl','fl','gl','pl','sl','br','cr','dr','fr','gr','pr','tr','st','wr','qu'];
function sylls(word){const lw=word.toLowerCase();if(lw.replace(/[^a-z]/g,'').length<=3)return[word];
  const isV=i=>{const c=lw[i];if('aeiou'.includes(c))return true;return c==='y'&&i>0&&!'aeiou'.includes(lw[i-1])};
  let g=[];for(let i=0;i<lw.length;i++){if(isV(i)){let j=i;while(j+1<lw.length&&isV(j+1)&&lw[j+1]!=='y')j++;g.push([i,j]);i=j}}
  if(g.length>1){const[a,b]=g[g.length-1],tail=lw.slice(b+1),before=lw.slice(0,a);
    if(a===b&&lw[a]==='e'){if(tail===''&&!/[^aeiou]l$/.test(before))g.pop();else if(tail==='s'&&!/(s|x|z|ch|sh|c|g)$/.test(before)&&!/[^aeiou]l$/.test(before))g.pop();else if(tail==='d'&&!/[td]$/.test(before))g.pop()}}
  if(g.length<=1)return[word];
  const cuts=g.slice(0,-1).map((x,k)=>{const e=x[1],n=g[k+1][0],cons=n-e-1;if(cons<=1)return e+1;
    const two=lw.slice(n-2,n);if(['th','sh','ch','wh'].includes(two))return n-2;if(['ck','ng'].includes(two))return n;if(BLENDS.includes(two)&&cons>2)return n-2;return n-1});
  const parts=[];let q=0;cuts.forEach(c=>{parts.push(word.slice(q,c));q=c});parts.push(word.slice(q));return parts.filter(Boolean)}
function sylInfo(v){if(SYL[v.id])return SYL[v.id];let n=0;return SYL[v.id]=words(v).map(w=>{const parts=sylls(w.core);const o={parts,s0:n};n+=parts.length;return o})}
function tune(v){if(TUNES[v.id])return TUNES[v.id];
  const r=rng('tune:'+v.id),root=60+Math.floor(r()*5),P=[0,2,4,7,9,12,14,16];
  const motif=()=>{let d=2+Math.floor(r()*3);const a=[];for(let i=0;i<12;i++){a.push(d);d=Math.max(0,Math.min(6,d+[-1,1,1,-1,2,-2,0,1][Math.floor(r()*8)]))}return a};
  const A=motif(),B=motif(),W=words(v),SI=sylInfo(v),notes=[],lines=[];let t=0;
  v.chunks.forEach((c,ci)=>{const m=ci%2?B:A,last=ci===v.chunks.length-1,t0=t;let prev=2,k=0;
    const idx=W.map((w,i)=>i).filter(i=>W[i].ci===ci),total=idx.reduce((n,i)=>n+SI[i].parts.length,0);
    idx.forEach(wi=>SI[wi].parts.forEach((pt,pk)=>{const end=k===total-1;let deg=m[k%m.length];if(end)deg=last||ci%2?(prev>=3?5:0):3;
      const dur=end?2:(SI[wi].parts.length===1&&W[wi].n.length>=6?1.5:1);
      notes.push({t,dur,midi:root+P[deg],w:wi,s:SI[wi].s0+pk});prev=deg;t+=dur;k++}));
    lines.push({t0,t1:t,bass:root-12+(last?0:[0,5,7,0][ci%4]),ci});t+=0.5});
  return TUNES[v.id]={notes,lines,total:t}}
function voice(ctx,out,midi,s,d){const f=440*Math.pow(2,(midi-69)/12);
  [['triangle',1,0.22],['sine',2,0.04]].forEach(([type,mul,vol])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f*mul;
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+0.025);g.gain.exponentialRampToValueAtTime(vol*0.45,s+Math.min(0.25,d*0.5));g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g);g.connect(out);o.start(s);o.stop(s+d+0.05)})}
function pad(ctx,out,midi,s,d){[0,7,12].forEach((iv,k)=>{const o=ctx.createOscillator(),g=ctx.createGain(),vol=k?0.03:0.06;o.type='sine';o.frequency.value=440*Math.pow(2,(midi+iv-69)/12);
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+0.12);g.gain.setValueAtTime(vol,s+Math.max(0.13,d-0.2));g.gain.exponentialRampToValueAtTime(0.0001,s+d+0.4);
  o.connect(g);g.connect(out);o.start(s);o.stop(s+d+0.5)})}
function playTune(v,{chunk=null,onWord=null,onNote=null,onEnd=null}={}){stopTune();const ctx=ac();if(!ctx)return false;
  const tn=tune(v),beat={slow:0.62,normal:0.44,fast:0.32}[state.settings.tempo]||0.44;let notes=tn.notes,lines=tn.lines,off=0,end=tn.total;
  if(chunk!=null){const L=tn.lines[chunk];notes=notes.filter(n=>n.t>=L.t0&&n.t<L.t1);lines=[L];off=L.t0;end=L.t1}
  const master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
  const T=ctx.currentTime+0.08,timers=[];
  notes.forEach(n=>{const s=T+(n.t-off)*beat;voice(ctx,master,n.midi,s,n.dur*beat*0.95);if(onWord||onNote)timers.push(setTimeout(()=>{onWord&&onWord(n.w);onNote&&onNote(n)},(s-ctx.currentTime)*1000))});
  lines.forEach(L=>pad(ctx,master,L.bass,T+(L.t0-off)*beat,(L.t1-L.t0)*beat));
  timers.push(setTimeout(()=>{const cb=PLAY&&PLAY.onEnd;PLAY=null;cb&&cb()},((end-off)*beat+0.4)*1000));

function stopTune(){if(!PLAY)return;const p=PLAY;PLAY=null;p.timers.forEach(clearTimeout);try{p.master.gain.setTargetAtTime(0,AC.currentTime,0.03);setTimeout(()=>p.master.disconnect(),250)}catch(e){}p.onEnd&&p.onEnd()}
function karaoke(btn,v,root){ // toggles play/stop on a button, lighting words inside root
  if(PLAY&&btn.classList.contains('on')){stopTune();return}
  const ws=$$('.w',root);
  const reset=()=>{btn.classList.remove('on');btn.innerHTML=IC.note+'<span>Play the tune</span>';ws.forEach(x=>x.classList.remove('lit'))};
  const ok=playTune(v,{onWord:i=>{ws.forEach(x=>x.classList.toggle('lit',+x.dataset.w===i))},onEnd:reset});
  if(ok){btn.classList.add('on');btn.innerHTML=IC.stop+'<span>Stop</span>'}}

let DL=null,DICT=null,TTS=null,dictTarget=null,dictPartial=null;
function deviceVoice(){return{speak(text){return new Promise((res,rej)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=0.9;u.lang='en-US';u.onend=()=>res();u.onerror=e=>rej({code:e.error||'upstream_error'});speechSynthesis.speak(u)}catch(e){rej({code:'unavailable'})}})},stop(){try{speechSynthesis.cancel()}catch(e){}}}}
async function initCaps(){
  if(!(window.claude&&window.claude.use)){if('speechSynthesis' in window){TTS=deviceVoice();document.body.classList.add('has-tts')}return}
  try{DICT=await window.claude.use('dictation')}catch(e){DICT=null}
  try{TTS=await window.claude.use('tts')}catch(e){TTS=null}
  try{DL=await window.claude.use('downloads')}catch(e){DL=null}
  if(DICT){document.body.classList.add('has-dict');
    DICT.onFinal(({text})=>{if(!dictTarget)return;const cur=dictTarget.value;dictTarget.value=cur?cur+text:text.trimStart();dictTarget.dispatchEvent(new Event('input',{bubbles:true}))});
    DICT.onPartial(({text})=>{if(dictPartial)dictPartial.textContent=text});
    DICT.onState(({state:st,reason})=>{$$('.mic').forEach(b=>{const on=st!=='idle';b.classList.toggle('on',on);b.querySelector('span').textContent=on?'Listening… tap to stop':'Say it aloud'});
      if(st==='idle'){if(dictPartial)dictPartial.textContent='';if(reason==='unavailable'||reason==='not_granted')document.body.classList.remove('has-dict')}})}
  if(!TTS&&'speechSynthesis' in window)TTS=deviceVoice();
  if(TTS)document.body.classList.add('has-tts')}

  dictTarget=ta;DICT.start().catch(e=>{const m={not_granted:'Microphone access was declined. You can still type your answer.',dismissed:'Tap the microphone again when you’re ready.',unavailable:'Voice input isn’t available here. You can type instead.',rate_limited:'Voice input is busy. Try again in a moment.',stopped:''}[e.code];
    if(m!=='')toast(m||'Voice input stopped. You can type instead.');if(e.code==='not_granted'||e.code==='unavailable')document.body.classList.remove('has-dict')})}

function exFirst(it){const v=V(it.vid),W=words(v);let end=W.length;

function diffWords(v,said){const T=words(v),A=said.split(/\s+/).map(norm).filter(Boolean);const m=T.length,n=A.length;

  const hit=new Set();let i=0,j=0;while(i<m&&j<n){if((T[i].n===A[j]||(T[i].n.length>=5&&lev(T[i].n,A[j])<=1))&&dp[i][j]===dp[i+1][j+1]+1){hit.add(i);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}

function finish(){const t=today(),firsts=Object.values(S.first),right=firsts.filter(f=>f.ok).length;
  const lg=state.log[t]||(state.log[t]={xp:0,done:false});lg.xp+=S.xp;

    if(wv){const arr=state.weekDays[wv.id]||(state.weekDays[wv.id]=[]);if(!arr.includes(day))arr.push(day);

function welcomeHTML(){return `<div class="card" id="welcome"><h3>Welcome! What’s your first name?</h3><p class="note">It’s only used in your greeting, and it stays on this device.</p><div class="row"><input id="nameIn" class="name-in" placeholder="Your first name" autocomplete="given-name"><button class="btn primary" data-name-save>Save</button></div><div><button class="btn small quiet" data-name-skip>Skip</button></div></div>`}
function setName(n){state.name=String(n||'').trim().slice(0,40);save();render()}
const realToday=()=>ymd(new Date());
function backupDue(){if(state.lastBackup)return diffDays(state.lastBackup,realToday())>=30;return Object.values(state.log).filter(x=>x.done).length>=5}
function backupNudge(){if(!backupDue())return'';return `<p class="nudge">${IC.save}<span>${state.lastBackup?`Last backup was ${diffDays(state.lastBackup,realToday())} days ago.`:'Your progress hasn’t been backed up yet.'}</span><button class="linkish" data-backup>Back up now</button></p>`}
function backupDone(){state.lastBackup=realToday();save();render();toast('Backup saved.')}
async function saveBackup(){const name=`hidden-heart-backup-${realToday()}.json`;
  const json=JSON.stringify({app:'hidden-in-my-heart',version:1,savedAt:new Date().toISOString(),state},null,1);
  if(DL){try{await DL.save({filename:name,data:json});backupDone()}catch(e){if(e&&e.code!=='declined')toast('The backup couldn’t be saved here.')}return}
  if(window.claude){toast('Saving files isn’t available in this view.');return}
  let file=null;try{file=new File([json],name,{type:'application/json'})}catch(e){}
  const touch=matchMedia('(pointer: coarse)').matches;
  if(file&&touch&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Hidden in My Heart backup'});backupDone()}catch(e){if(e&&e.name!=='AbortError')toast('The backup couldn’t be shared. Try again.')}return}
  try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);backupDone()}catch(e){toast('The backup couldn’t be saved.')}}
let PENDING=null;
$('#restoreIn').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  let obj=null;try{obj=JSON.parse(await f.text())}catch(err){}
  if(!obj||obj.app!=='hidden-in-my-heart'||!obj.state||!obj.state.start){toast('That file isn’t a Hidden in My Heart backup.');return}
  PENDING=obj;const when=obj.savedAt?new Date(obj.savedAt).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}):'an earlier date';
  const box=$('#restoreConfirm');if(box)box.innerHTML=`<div class="confirm"><span>Replace the progress on this device with the backup from ${esc(when)}?</span><button class="btn small danger" data-restore-yes>Replace</button><button class="btn small" data-restore-no>Cancel</button></div>`});

let ADD_OPEN=false,DEL_ID=null,ADD_WHEN='next';
function addFormHTML(){const w=[['tomorrow','Tomorrow'],['next','Next week'],['later','End of my list']];
  return `<div class="card set" id="addForm"><h3>Add your own verse</h3>
  <label class="h" for="addRef">Reference</label><input id="addRef" class="name-in" placeholder="For example, Isaiah 26:3" autocomplete="off">
  <label class="h" for="addTr">Translation (optional)</label><input id="addTr" class="name-in" placeholder="For example, NIV, ESV or KJV" autocomplete="off">
  <label class="h" for="addText">Verse text</label><textarea id="addText" class="recite" placeholder="Type or paste the verse. To choose where the phrases break, put each phrase on its own line."></textarea>
  <label class="h">When should it start?</label><div class="seg">${w.map(([k,n])=>`<button data-when="${k}" aria-pressed="${ADD_WHEN===k}">${n}</button>`).join('')}</div>
  <p class="note" id="addMsg" aria-live="polite"></p>
  <div class="row"><button class="btn primary" data-add-save>Add verse</button><button class="btn quiet" data-add-cancel>Cancel</button></div>
  <p class="note">Your verses are saved on this phone and in your backups. Use any translation you like.</p></div>`}
function phraseSplit(raw){const lines=raw.split(/\n+/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean);if(lines.length>1)return lines;
  const ws=(lines[0]||'').split(' ').filter(Boolean),out=[];let cur=[];
  const BRK=new Set('and but for because that who whose which when where those so then or nor yet through'.split(' '));
  ws.forEach((w,i)=>{cur.push(w);const nx=(ws[i+1]||'').toLowerCase().replace(/[^a-z]/g,'');
    if((/[,;:.?!][”"’)]?$/.test(w)&&cur.length>=3)||(BRK.has(nx)&&cur.length>=5)||cur.length>=9){out.push(cur.join(' '));cur=[]}});
  if(cur.length){if(cur.length<3&&out.length)out[out.length-1]+=' '+cur.join(' ');else out.push(cur.join(' '))}return out}
function addCustom(){const ref=$('#addRef').value.trim().slice(0,60),tr=$('#addTr').value.trim().slice(0,30),raw=$('#addText').value.trim(),msg=m=>{$('#addMsg').textContent=m};
  if(!ref){msg('Add the reference, like Isaiah 26:3.');$('#addRef').focus();return}
  if(raw.split(/\s+/).length<3){msg('Type the words of the verse (at least a few words).');$('#addText').focus();return}
  if(raw.split(/\s+/).length>160){msg('That’s a long passage. Try one up to about 150 words.');return}
  const id='my-'+Date.now().toString(36),v={id,ref,tag:tr||'Your verse',trans:tr,chunks:phraseSplit(raw)};
  state.custom.push(v);VERSES.push({...v,custom:true});const{w}=weekPos(),o=state.order;
  if(ADD_WHEN==='later')o.push(id);else{o.splice(Math.min(w+1,o.length),0,id);if(ADD_WHEN==='tomorrow'){const wv=weekVerse();state.nextUp={id,from:today(),cur:wv?wv.id:null}}}
  ADD_OPEN=false;save();render();toast(ADD_WHEN==='tomorrow'?`${ref} starts tomorrow.`:ADD_WHEN==='next'?`${ref} is up next week.`:`${ref} added to the end of your list.`)}
function removeCustom(id){const o=state.order,i=o.indexOf(id),{w}=weekPos();
  if(i>=0){o.splice(i,1);if(i<w)state.start=addDays(state.start,7);else if(i===w)state.start=addDays(today(),-w*7)}
  state.custom=state.custom.filter(c=>c.id!==id);syncCustom(state.custom);['srs','weekDays','retired','weekCheck'].forEach(k=>delete state[k][id]);
  state.second=state.second.filter(x=>x.id!==id);if(state.nextUp?.id===id)delete state.nextUp;DEL_ID=null;save();render();toast('Verse removed.')}

function dateLines(t,w,day,hasVerse){const d=pd(t),f=o=>d.toLocaleDateString(undefined,o),wk=`Week ${w+1}`;
  return hasVerse?[`${f({weekday:'long',month:'long',day:'numeric'})} · ${wk}, day ${day+1} of 7`,`${f({weekday:'short',month:'short',day:'numeric'})} · ${wk} · Day ${day+1} of 7`,`${f({month:'short',day:'numeric'})} · ${wk} · Day ${day+1}/7`]
   :[`${f({weekday:'long',month:'long',day:'numeric'})} · ${wk}`,`${f({weekday:'short',month:'short',day:'numeric'})} · ${wk}`]}
function fitLines(){$$('.fit[data-fit]').forEach(el=>{let opts;try{opts=JSON.parse(el.dataset.fit)}catch(e){return}
  el.style.fontSize='';const fits=()=>el.scrollWidth<=el.clientWidth+1;
  for(const o of opts){el.textContent=o;if(fits())return}
  const base=parseFloat(getComputedStyle(el).fontSize);for(let k=0.95;k>=0.7;k-=0.05){el.style.fontSize=(base*k)+'px';if(fits())return}})}
let fitT;addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitLines,120)});
try{document.fonts&&document.fonts.ready.then(fitLines)}catch(e){}
/* A verse chosen with "Start this verse tomorrow" takes over the next day.
   The verse it interrupts moves two weeks later in the line-up (not removed). */
function applyNextUp(){const n=state.nextUp;if(!n||today()<=n.from)return;delete state.nextUp;
  const id=n.id;if(!V(id)||learnedIds().includes(id)){save();return}
  const{w}=weekPos(),o=state.order,cur=o[w];o.splice(o.indexOf(id),1);
  if(n.cur&&cur===n.cur){const done=(state.weekDays[cur]||[]).length;
    if(done>=3){state.second=state.second.filter(x=>x.id!==cur);state.second.push({id:cur,stage:Math.min(done,6),last:null});if(state.second.length>2)state.second.shift()}
    o.splice(o.indexOf(cur),1);o.splice(w,0,id);o.splice(Math.min(w+2,o.length),0,cur);delete state.weekDays[cur]}
  else o.splice(w,0,id);
  state.start=addDays(today(),-w*7);delete state.weekDays[id];save()}
/* Second focus: a verse you were most of the way through when you switched (3+ lessons done)
   keeps one exercise a day, getting harder, until you say it from memory; then it moves to Keeping fresh. */

  if(d.sing){openSing(d.sing);return}
  if(d.edit){openEdit(d.edit);return}
  if(d.addOpen!==undefined){ADD_OPEN=true;render();setTimeout(()=>$('#addRef')&&$('#addRef').focus(),50);return}
  if(d.addCancel!==undefined){ADD_OPEN=false;render();return}
  if(d.addSave!==undefined){addCustom();return}
  if(d.when){ADD_WHEN=d.when;$$('[data-when]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.when===ADD_WHEN)));return}
  if(d.del){DEL_ID=d.del;const y=scrollY;render();scrollTo(0,y);return}
  if(d.delNo!==undefined){DEL_ID=null;const y=scrollY;render();scrollTo(0,y);return}
  if(d.delYes){removeCustom(d.delYes);return}
  if(d.nameSave!==undefined){setName($('#nameIn').value);return}
  if(d.nameSkip!==undefined){setName('');return}
  if(d.nameSet!==undefined){setName($('#nameSet').value);toast('Name saved.');return}
  if(d.backup!==undefined){saveBackup();return}
  if(d.restore!==undefined){$('#restoreIn').click();return}
  if(d.restoreYes!==undefined){if(PENDING){state=normalize(PENDING.state);PENDING=null;save();render();toast('Progress restored.')}return}
  if(d.restoreNo!==undefined){PENDING=null;$('#restoreConfirm').innerHTML='';return}
  if(d.go==='daily'){startSession(dailyItems(),'daily');return}
  if(d.adv){nextLesson();if(d.adv==='go')startSession(dailyItems(),'daily');else{render();toast('Skipped to the next lesson.')}return}
  if(d.know!==undefined){const wv=weekVerse();$('#knowPanel').innerHTML=`<div class="card"><p><b>Already know ${esc(wv.ref)}?</b> Say or type it once from memory. Get about 80% of the words and it moves to Keeping fresh, and the next verse starts today.</p><div class="row"><button class="btn primary" data-testout="${wv.id}">Test me (about 1 minute)</button><button class="btn" data-knowskip="${wv.id}">Skip without a test</button><button class="btn" data-knowretire="${wv.id}">Skip and don’t review it</button><button class="btn quiet" data-knowcancel>Cancel</button></div><p class="note">If you skip the test, the verse still comes back as a callback in a few days to make sure it stuck. Choose “don’t review it” to leave it out of callbacks; you can turn reviews back on from the Verses tab.</p></div>`;return}
  if(d.testout){startSession([{kind:'recite',p:false,vid:d.testout,seed:hash(String(Date.now())),key:'t0',testout:true}],'testout');return}
  if(d.knowskip){const nx=state.order[weekPos().w+1];knowVerse(d.knowskip,false);render();toast(nx?`${V(nx).ref} is now this week’s verse.`:'All starter verses learned.');return}
  if(d.retire){const id=d.retire;if(state.retired[id]){delete state.retired[id];state.srs[id].due=today();toast(`${V(id).ref} is back in your callbacks.`)}else{state.retired[id]=true;toast(`${V(id).ref} won’t come up in callbacks. You can resume it anytime.`)}save();render();return}
  if(d.knowretire){const nx=state.order[weekPos().w+1];knowVerse(d.knowretire,false);state.retired[d.knowretire]=true;save();render();toast(nx?`Skipped. ${V(nx).ref} is now this week’s verse.`:'Skipped.');return}
  if(d.knowcancel!==undefined){$('#knowPanel').innerHTML='';return}
  if(d.unveil!==undefined){el.closest('.veil').classList.remove('on');return}
  if(d.tune){karaoke(el,V(d.tune),$('#homeVerse'));return}
  if(d.say){speak(fullText(V(d.say)));return}
  if(d.tuneSolo){const was=el.classList.contains('on');stopTune();if(!was){if(playTune(V(d.tuneSolo),{onEnd:()=>{el.classList.remove('on');el.innerHTML=IC.note+'<span>Tune</span>'}})){el.classList.add('on');el.innerHTML=IC.stop+'<span>Stop</span>'}}return}
  if(d.extra){startSession(extraItems(d.extra),'extra');return}
  if(d.nextup){const wv=weekVerse();state.nextUp={id:d.nextup,from:today(),cur:wv?wv.id:null};save();render();toast(`${V(d.nextup).ref} starts tomorrow.`);return}
  if(d.nextupCancel!==undefined){delete state.nextUp;save();render();toast('Okay, no change to your schedule.');return}
  if(d.swap){const{w}=weekPos(),i=state.order.indexOf(d.swap);[state.order[w],state.order[i]]=[state.order[i],state.order[w]];save();TAB='today';render();toast(`${V(d.swap).ref} is now this week’s verse.`);return}
  if(d.set){let v=d.val;if(v==='true')v=true;if(v==='false')v=false;state.settings[d.set]=v;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.dev==='day'){state.offset++;save();render();toast('Moved ahead one day.');return}
  if(d.dev==='week'){const{day}=weekPos();state.offset+=7-day;save();render();toast('Moved to the start of next week.');return}
  if(d.dev==='real'){state.offset=0;save();render();return}
  if(d.dev==='reset'){$('#resetConfirm').innerHTML='<div class="confirm"><span>Erase all progress and start over at week 1?</span><button class="btn small danger" data-dev="reset-yes">Erase</button><button class="btn small" data-dev="reset-no">Cancel</button></div>';return}
  if(d.dev==='reset-yes'){syncCustom([]);state=fresh();applyEdits(state);save();render();toast('Progress reset.');return}
  if(d.dev==='reset-no'){$('#resetConfirm').innerHTML='';return}
});

document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='nameIn'){e.preventDefault();setName(e.target.value)}else if(e.target.id==='nameSet'){e.preventDefault();setName(e.target.value);toast('Name saved.')}});
applySettings();render();initCaps();
</script>

<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
